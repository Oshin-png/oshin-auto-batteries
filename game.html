<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLEFRONT: LAGOS</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:30px;z-index:10;pointer-events:none}
#ui{position:fixed;top:10px;left:10px;color:#ffcc00;font-weight:bold;z-index:10}
#shoot{position:fixed;bottom:20px;right:20px;width:90px;height:90px;background:#ffcc00;border-radius:50%;border:none;font-weight:bold;font-size:18px}
canvas{width:100%;height:100vh;display:block}
</style>
</head>
<body>
<div id="crosshair">+</div>
<div id="ui">BATTLEFRONT: LAGOS<br>Kills: <span id="kills">0</span> | Players: 5</div>
<button id="shoot">SHOOT</button>
<canvas id="game"></canvas>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
let kills=0;
let enemies=[
 {x:200,y:200,name:'Player_Tunde'},
 {x:500,y:300,name:'Player_Sam'},
 {x:800,y:150,name:'Player_Musa'},
 {x:300,y:500,name:'Player_Emeka'},
 {x:600,y:400,name:'Player_John'}
];
function draw(){
 ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle='#333';for(let i=0;i<20;i++)ctx.fillRect(Math.random()*c.width,Math.random()*c.height,60,60);
 enemies.forEach(e=>{
  ctx.fillStyle='red';ctx.fillRect(e.x,e.y,40,60);
  ctx.fillStyle='white';ctx.fillRect(e.x,e.y-20,80,15);
  ctx.fillStyle='black';ctx.font='10px Arial';ctx.fillText(e.name,e.x,e.y-10);
 });
 requestAnimationFrame(draw);
}
function shoot(){
 let hit=enemies.findIndex(e=>Math.abs(e.x+20 - c.width/2)<60 && Math.abs(e.y+30 - c.height/2)<80);
 if(hit>-1){enemies.splice(hit,1);kills++;document.getElementById('kills').innerText=kills;
 if(enemies.length==0){alert('YOU WIN! All players eliminated!');location.reload();}
 enemies.push({x:Math.random()*c.width,y:Math.random()*c.height,name:'Player_'+Math.floor(Math.random()*1000)});
 }
}
document.getElementById('shoot').onclick=shoot;
c.onclick=shoot;
window.addEventListener('keydown',e=>{if(e.code=='Space')shoot();});
draw();
</script>
</body>
</html>
